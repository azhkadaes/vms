name: vms-backend-stage1
x-vms-build: &vms-build
  context: .
  dockerfile: Dockerfile
  target: ${VMS_STAGE1_BUILD_TARGET:-prod}
  additional_contexts:
    vms_binaries: ${VMS_STAGE1_BINARY_CONTEXT:-.}
services:
  db:
    image: postgres:18.6
    restart: "no"
    environment:
      POSTGRES_DB: vms_stage1
      POSTGRES_USER: vms_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    ports:
      - "127.0.0.1:${VMS_STAGE1_PG_PORT:-55450}:5432"
    volumes:
      - pg18_data:/var/lib/postgresql
      - ./ops/stage1/init-db.sh:/docker-entrypoint-initdb.d/001-vms-roles.sh:ro
    secrets:
      - db_owner_password
      - db_migrator_password
      - db_api_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vms_owner -d vms_stage1"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: ["api"]
    build: *vms-build
    image: ${VMS_STAGE1_IMAGE:-vms-backend:stage1}
    restart: "no"
    environment:
      APP_ENVIRONMENT: development
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: vms_api
      DB_PASSWORD_FILE: /run/secrets/db_api_password
      DB_NAME: vms_stage1
      DB_SSL_MODE: disable
      RATE_LIMIT_KEY_FILE: /run/secrets/rate_key
      STAFF_ORIGIN: ${VMS_STAGE1_STAFF_ORIGIN:-http://127.0.0.1:${VMS_STAGE1_API_PORT:-58050}}
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_key
      CSRF_KEY_FILE: /run/secrets/csrf_key
      REFRESH_RECOVERY_KEY_FILE: /run/secrets/refresh_recovery_key
      GATEWAY_INIT_KEY_FILE: /run/secrets/gateway_init_key
      GATEWAY_INIT_NETWORKS: ${VMS_STAGE1_GATEWAY_NETWORKS:-127.0.0.1/32,::1/128}
      UPLOAD_DIR: /var/lib/vms/uploads
      UPLOAD_TOKEN_KEY_FILE: /run/secrets/upload_token_key
      VMS_ADMISSION_QR_KEY_FILE: /run/secrets/admission_qr_key
      VMS_NOTICE_VERSION: ${VMS_NOTICE_VERSION:-}
      VMS_NOTICE_ID: ${VMS_NOTICE_ID:-}
      VMS_NOTICE_EN: ${VMS_NOTICE_EN:-}
    ports:
      - "127.0.0.1:${VMS_STAGE1_API_PORT:-58050}:8080"
    secrets:
      - db_api_password
      - rate_key
      - jwt_key
      - csrf_key
      - refresh_recovery_key
      - gateway_init_key
      - upload_token_key
      - admission_qr_key
    volumes:
      - upload_data:/var/lib/vms/uploads
    depends_on:
      db:
        condition: service_healthy
  migrate:
    profiles: ["tools"]
    image: ${VMS_STAGE1_IMAGE:-vms-backend:stage1}
    build: *vms-build
    entrypoint: ["/vms-migrate"]
    command: ["-mode", "plan"]
    environment:
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: vms_migrator
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
      DB_NAME: vms_stage1
      DB_SSL_MODE: disable
    secrets:
      - db_migrator_password
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg18_data:
  upload_data:
secrets:
  db_owner_password:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/db_owner_password
  db_migrator_password:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/db_migrator_password
  db_api_password:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/db_api_password
  rate_key:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/rate_key
  jwt_key:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/jwt_key
  csrf_key:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/csrf_key
  refresh_recovery_key:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/refresh_recovery_key
  gateway_init_key:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/gateway_init_key
  upload_token_key:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/upload_token_key
  admission_qr_key:
    file: ${VMS_PRIVATE_DIR:-./.runtime/stage1}/admission_qr_key
