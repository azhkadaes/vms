# Optional Air live reload for the existing VMS API entrypoint.
root = "."
tmp_dir = "tmp"

# Build settings
[build]
  # Command to build the app
  cmd = "go build -o ./tmp/main ./cmd"
  # Binary to run
  bin = "./tmp/main"
  # Delay before restart (ms)
  delay = 1000
  include_ext = ["go", "json"]
  exclude_dir = ["tmp", "bin", ".runtime", "vendor", ".git"]
  stop_on_error = true
  send_interrupt = true

# Log settings
[log]
  time = true
